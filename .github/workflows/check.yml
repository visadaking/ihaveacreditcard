name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-and-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n install.sh
      - name: python syntax
        run: python3 -m py_compile scripts/*.py
      - name: doctor self-check (fresh runners have no keys/tools → warnings only)
        run: python3 scripts/tui.py --check
